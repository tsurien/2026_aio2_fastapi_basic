<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>도서 목록</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        /* 버튼 */
        button {
            padding: 10px 20px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        /* 표 */
        table {
            width: 100%;
            border-collapse: collapse;

            /* 데이터를 불러와도 열 크기 유지 */
            table-layout: fixed;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>


<body>

    <h1>도서 목록</h1>


    <!-- 버튼을 눌렀을 때 도서 목록 불러오기 -->
    <button id="loadBtn">
        도서 목록 불러오기
    </button>


    <table>

        <!-- 각 열의 크기를 고정 -->
        <colgroup>
            <col style="width: 10%;">
            <col style="width: 40%;">
            <col style="width: 25%;">
            <col style="width: 25%;">
        </colgroup>


        <thead>
            <tr>
                <th>ID</th>
                <th>제목</th>
                <th>저자</th>
                <th>출판년도</th>
            </tr>
        </thead>


        <!--
            처음에는 비어 있음
            버튼을 누르면 JavaScript가 여기에 데이터를 추가함
        -->
        <tbody id="book-list">

        </tbody>

    </table>


    <script>

        // 도서 목록 불러오기 버튼 찾기
        const loadBtn = document.getElementById("loadBtn");


        // 버튼 클릭
        loadBtn.addEventListener("click", async () => {

            // FastAPI의 도서 목록 API 호출
            const response = await fetch("/api/books");


            // 받은 JSON 데이터를 JavaScript 데이터로 변환
            const books = await response.json();


            // tbody 가져오기
            const bookList = document.getElementById("book-list");


            // 기존 목록 삭제
            bookList.innerHTML = "";


            // books에 들어있는 도서를 하나씩 가져오기
            for (const book of books) {

                // tr 생성
                const row = document.createElement("tr");


                // 한 줄에 도서 정보 넣기
                row.innerHTML = `
                    <td>${book.id}</td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.year}</td>
                `;


                // tbody에 추가
                bookList.appendChild(row);
            }

        });

    </script>

</body>

</html>
