<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>도서 검색</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <h1>도서 검색</h1>

        <p class="subtitle">
            제목 키워드로 원하는 도서를 검색하세요.
        </p>

        <div class="search-box">

            <input
                id="keyword"
                type="text"
                placeholder="제목 키워드 입력"
            >

            <button id="searchBtn">
                검색
            </button>

        </div>

        <div class="table-box">

            <table>

                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 40%;">
                    <col style="width: 25%;">
                    <col style="width: 25%;">
                </colgroup>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>제목</th>
                        <th>저자</th>
                        <th>출판년도</th>
                    </tr>
                </thead>

                <tbody id="search-result">

                    <tr>
                        <td colspan="4">
                            검색어를 입력해주세요.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

        <p id="message"></p>

    </main>

    <script>
        document
            .getElementById("searchBtn")
            .addEventListener("click", async () => {

                const keyword =
                    document.getElementById("keyword").value;

                const response =
                    await fetch(
                        "/books/search?keyword=" +
                        encodeURIComponent(keyword)
                    );

                const books =
                    await response.json();

                const searchResult =
                    document.getElementById("search-result");

                const message =
                    document.getElementById("message");

                searchResult.innerHTML = "";
                message.textContent = "";

                if (books.length === 0) {

                    searchResult.innerHTML = `
                        <tr>
                            <td colspan="4">
                                검색 결과 없음
                            </td>
                        </tr>
                    `;

                    message.textContent =
                        "검색 결과가 없습니다.";

                    return;
                }

                for (const book of books) {

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `
                        <td>${book.id}</td>
                        <td>${book.title}</td>
                        <td>${book.author}</td>
                        <td>${book.year}</td>
                    `;

                    searchResult.appendChild(row);
                }
            });
    </script>

</body>

</html>
