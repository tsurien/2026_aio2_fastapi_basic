<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>도서 단건 조회</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <main class="container">
    <h1>도서 단건 조회</h1>
    <p class="subtitle">도서 번호를 입력해 상세 정보를 확인하세요.</p>

    <div class="search-box">
      <input id="bookId" type="number" placeholder="도서 번호 입력">
      <button id="findBtn">조회</button>
    </div>

    <div class="table-box">
      <table>
        <colgroup>
          <col style="width:10%">
          <col style="width:40%">
          <col style="width:25%">
          <col style="width:25%">
        </colgroup>

        <thead>
          <tr>
            <th>ID</th>
            <th>제목</th>
            <th>저자</th>
            <th>출판년도</th>
          </tr>
        </thead>

        <tbody id="book-detail">
          <tr>
            <td colspan="4">도서 번호를 입력해주세요.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p id="message"></p>
  </main>

  <script>
    document.getElementById("findBtn").addEventListener("click", async () => {
      const id = document.getElementById("bookId").value;
      const response = await fetch("/books/" + id);
      const book = await response.json();

      const bookDetail = document.getElementById("book-detail");
      const message = document.getElementById("message");

      bookDetail.innerHTML = "";
      message.textContent = "";

      if (!response.ok) {
        bookDetail.innerHTML = `
          <tr>
            <td colspan="4">조회 결과 없음</td>
          </tr>
        `;
        message.textContent = "도서를 찾을 수 없습니다.";
        return;
      }

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${book.id}</td>
        <td>${book.title}</td>
        <td>${book.author}</td>
        <td>${book.year}</td>
      `;

      bookDetail.appendChild(row);
    });
  </script>
</body>
</html>
