<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서 목록</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing:border-box; }

    body {
      min-height:100vh;
      margin:0;
      padding:50px 20px;
      color:#eee;
      font-family:"Gowun Batang", serif;
      background:radial-gradient(circle at top,#292929 0,#111 45%,#050505 100%);
    }

    .container {
      width:100%;
      max-width:900px;
      margin:auto;
      text-align:center;
    }

    h1 {
      margin:0 0 10px;
      font-family:"BMEULJIRO","Gowun Batang",serif;
      font-size:42px;
      letter-spacing:1px;
      background:linear-gradient(#fff,#999);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle {
      margin:0 0 35px;
      color:#777;
      font-size:14px;
    }

    button {
      margin-bottom:20px;
      padding:12px 24px;
      color:#eee;
      font:700 14px "Gowun Batang",serif;
      cursor:pointer;
      border:1px solid rgba(255,255,255,.12);
      border-radius:10px;
      background:linear-gradient(145deg,rgba(255,255,255,.08),transparent),#181818;
      box-shadow:0 8px 25px #0007,inset 0 1px rgba(255,255,255,.08);
      transition:.25s;
    }

    button:hover {
      transform:translateY(-2px);
      border-color:#666;
      background:#222;
      box-shadow:0 12px 30px #0009;
    }

    .table-box {
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      background:linear-gradient(145deg,rgba(255,255,255,.04),transparent),#121212;
      box-shadow:0 15px 40px #0008,inset 0 1px rgba(255,255,255,.05);
    }

    table {
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }

    th, td {
      padding:14px 10px;
      text-align:center;
      border-bottom:1px solid #252525;
    }

    th {
      color:#aaa;
      font-size:13px;
      letter-spacing:.5px;
      background:#181818;
    }

    td {
      color:#ddd;
      font-size:14px;
    }

    tbody tr {
      transition:.2s;
    }

    tbody tr:hover {
      background:rgba(255,255,255,.035);
    }

    tbody tr:last-child td {
      border-bottom:0;
    }

    @media(max-width:600px) {
      h1 { font-size:34px; }
      th,td { padding:11px 5px; font-size:12px; }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>도서 목록</h1>
    <p class="subtitle">등록된 도서 정보를 확인합니다.</p>

    <button id="loadBtn">도서 목록 불러오기</button>

    <div class="table-box">
      <table>

        <colgroup>
          <col style="width:10%">
          <col style="width:40%">
          <col style="width:25%">
          <col style="width:25%">
        </colgroup>

        <thead>
          <tr>
            <th>ID</th>
            <th>제목</th>
            <th>저자</th>
            <th>출판년도</th>
          </tr>
        </thead>

        <tbody id="book-list"></tbody>

      </table>
    </div>

  </main>

  <script>
    const loadBtn = document.getElementById("loadBtn");

    loadBtn.addEventListener("click", async () => {
      const response = await fetch("/list");
      const books = await response.json();
      const bookList = document.getElementById("book-list");

      bookList.innerHTML = "";

      for (const book of books) {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${book.id}</td>
          <td>${book.title}</td>
          <td>${book.author}</td>
          <td>${book.year}</td>
        `;

        bookList.appendChild(row);
      }
    });
  </script>

</body>
</html>
