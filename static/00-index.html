<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:40px 20px; color:#eee; font-family:"Gowun Batang", serif;
      background:radial-gradient(circle at top,#292929 0,#111 45%,#050505 100%);
    }

    .container { width:100%; max-width:720px; text-align:center; }

    h1 {
      margin-bottom:10px; font-size:44px; letter-spacing:1px;
      font-family:"BMEULJIRO","Gowun Batang",serif;
      background:linear-gradient(#fff,#999);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }

    .subtitle { margin-bottom:42px; color:#777; font-size:15px; }

    .menu {
      display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
    }

    .menu a {
      padding:23px; border-radius:15px; color:#eee; text-decoration:none;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(145deg,rgba(255,255,255,.055),transparent),#141414;
      box-shadow:0 10px 28px #0007,inset 0 1px rgba(255,255,255,.06);
      transition:.25s;
    }

    .menu a:hover {
      transform:translateY(-4px); border-color:#555;
      background:#1c1c1c; box-shadow:0 16px 35px #0009;
    }

    .number {
      display:block; margin-bottom:7px;
      color:#666; font-size:11px; letter-spacing:3px;
    }

    .name { font-size:17px; font-weight:700; }

    .footer {
      margin-top:36px; color:#444; font-size:12px; letter-spacing:1px;
    }

    @media(max-width:600px) {
      .menu { grid-template-columns:1fr; }
      h1 { font-size:34px; }
    }
  </style>
</head>
