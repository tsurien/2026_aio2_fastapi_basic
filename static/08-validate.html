<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <title>검증 오류 표시</title>

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <main class="container">

    <h1>등록 (오류 표시)</h1>

    <p class="subtitle">
      입력값 검증 결과와 등록 상태를 확인합니다.
    </p>

    <div class="search-box">
      <input id="title" placeholder="제목">
      <input id="author" placeholder="저자">
      <input id="year" type="number" placeholder="연도">
      <button id="saveBtn">등록</button>
    </div>

    <div class="table-box">
      <ul id="errors"></ul>
      <p id="ok"></p>
    </div>

  </main>


  <script>
    document.getElementById("saveBtn").addEventListener("click", async () => {

      const saveBtn = document.getElementById("saveBtn");

      // 중복 클릭 방지
      saveBtn.disabled = true;

      const payload = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        year: Number(document.getElementById("year").value)
      };

      try {

        const res = await fetch("/books", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        const ul = document.getElementById("errors");
        const ok = document.getElementById("ok");

        ul.innerHTML = "";
        ok.textContent = "";

        if (res.status === 422) {

          for (const err of data.detail) {
            const li = document.createElement("li");
            li.textContent = err.loc.join(".") + " : " + err.msg;
            ul.appendChild(li);
          }

        } else if (res.ok) {

          ok.textContent = "등록 완료: " + data.title;

          // 등록 성공 후 입력칸 비우기
          document.getElementById("title").value = "";
          document.getElementById("author").value = "";
          document.getElementById("year").value = "";

        } else {

          ok.textContent = "오류: " + data.detail;

        }

      } finally {

        // 응답 처리 후 버튼 다시 활성화
        saveBtn.disabled = false;

      }

    });
  </script>

</body>

</html>
