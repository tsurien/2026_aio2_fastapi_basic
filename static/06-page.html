<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <title>도서 탐색</title>

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <main class="container">

    <h1>도서 탐색</h1>

    <p class="subtitle">
      이전 · 다음 버튼으로 도서 목록을 탐색합니다.
    </p>

    <div class="search-box">

      <button id="prevBtn">이전</button>
      <button id="nextBtn">다음</button>

    </div>

    <div class="table-box">

      <ul id="result"></ul>

    </div>

  </main>


  <script>
    let skip = 0;
    const limit = 2;


    async function render() {
      if (skip < 0) skip = 0;

      const books =
        await (
          await fetch(
            "/books/page?skip=" +
            skip +
            "&limit=" +
            limit
          )
        ).json();

      const ul =
        document.getElementById("result");

      ul.innerHTML = "";

      for (const b of books) {
        const li =
          document.createElement("li");

        li.textContent =
          b.id + ". " + b.title;

        ul.appendChild(li);
      }
    }


    document
      .getElementById("prevBtn")
      .addEventListener("click", () => {
        skip -= limit;
        render();
      });


    document
      .getElementById("nextBtn")
      .addEventListener("click", () => {
        skip += limit;
        render();
      });


    render();
  </script>

</body>

</html>
